<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<link rel="icon" href="data:,">
<title>你我身邊・台灣日常相簿｜4 × 10 DEMO</title>
<style>
:root{
  --bg:#f6f3ed;--panel:#fffdf9;--ink:#25302c;--muted:#6f7773;--line:#ddd8cf;
  --accent:#5e746a;--accent2:#b86f68;--soft:#e8eee9;--hero1:#fffdf9;--hero2:#eef2ed;
  --shadow:0 14px 34px rgba(20,30,26,.12)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;min-height:100vh;transition:background .24s ease,color .24s ease}body.locked{overflow:hidden}body.locked .site-shell{display:none}[hidden]{display:none!important}button,select,input,a{font:inherit}button{color:inherit}.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto}
.auth{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,var(--hero1),var(--hero2))}.auth-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 28px 80px rgba(0,0,0,.18)}.auth-mark{width:54px;height:48px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-weight:900;color:var(--accent);font-size:16px}.auth h1{font-size:28px;margin:18px 0 8px;letter-spacing:-.03em}.auth p{color:var(--muted);margin:0 0 22px;line-height:1.7;font-size:14px}.auth-form{display:grid;gap:12px}.auth-input{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:13px 14px;outline:none}.auth-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}.auth-submit{border:0;border-radius:14px;background:var(--accent);color:#fff;padding:13px 15px;font-weight:850;cursor:pointer}.auth-error{min-height:20px;margin:0;color:var(--accent2);font-size:13px;font-weight:700}
.hero{padding:40px 0 22px}.hero-card{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);border:1px solid var(--line);border-radius:28px;padding:30px 34px;box-shadow:var(--shadow)}.hero-card:after{content:"";position:absolute;right:-55px;top:-75px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,var(--soft) 0%,transparent 68%);pointer-events:none}.hero-top{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:1}.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.08em}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}.theme-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.05)}.theme-btn:hover{transform:translateY(-1px)}.hero h1{position:relative;z-index:1;margin:17px 0 8px;font-size:clamp(34px,5vw,56px);line-height:1.02;letter-spacing:-.04em}.subtitle{position:relative;z-index:1;margin:0;max-width:820px;color:var(--muted);font-size:clamp(15px,2vw,19px);line-height:1.7}.demo-note{margin-top:17px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--panel) 84%,transparent);border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.6;position:relative;z-index:1}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 16px;position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 74%,transparent)}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:800;font-size:14px;transition:.18s ease}.tab:hover{transform:translateY(-1px)}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 24%,transparent)}.tab-count{opacity:.78;font-size:11px;margin-left:5px}.sort-wrap{display:flex;align-items:center;gap:8px;flex:0 0 auto;color:var(--muted);font-size:13px}.sort{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 34px 9px 11px;color:var(--ink);font-weight:700}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 14px}.count{margin:0;color:var(--muted);font-size:13px}.category-link{color:var(--accent);font-size:12px;text-decoration:none;font-weight:750}.category-link:hover{text-decoration:underline}.ai-help{margin:0 0 16px;padding:13px 15px;border:1px solid var(--line);background:var(--panel);border-radius:15px;color:var(--muted);font-size:13px;line-height:1.65}.ai-help strong{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:42px}.card{border:1px solid color-mix(in srgb,var(--line) 72%,transparent);background:var(--panel);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.07);transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.12)}.card-open{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}.photo-wrap{position:relative;background:var(--soft);aspect-ratio:4/3;overflow:hidden}.photo{display:block;width:100%;height:100%;object-fit:cover}.drive-pill,.play-pill{position:absolute;top:9px;padding:5px 8px;border-radius:999px;background:rgba(10,15,13,.68);color:#fff;font-size:10px;font-weight:850;backdrop-filter:blur(8px)}.drive-pill{right:9px}.play-pill{left:9px;font-size:11px}.play-icon{position:absolute;left:50%;top:50%;translate:-50% -50%;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(15,20,18,.68);color:#fff;font-size:24px;box-shadow:0 8px 26px rgba(0,0,0,.24);pointer-events:none}.meta{padding:13px 14px 15px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.title{font-size:15px;font-weight:850;line-height:1.35}.date{margin-top:5px;color:var(--muted);font-size:12px}.cat{font-size:11px;font-weight:850;padding:6px 8px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}.prompt-zone{border-top:1px solid var(--line);padding:11px 12px 12px;display:grid;gap:8px}.prompt-preview{margin:0;color:var(--muted);font-size:11px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.copy-prompt{border:1px solid var(--line);background:var(--soft);color:var(--accent);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:850;cursor:pointer;text-align:center}.copy-prompt:hover{filter:brightness(.98)}
footer{padding:8px 0 42px;color:var(--muted);font-size:12px;line-height:1.6;text-align:center}.dialog{width:min(980px,calc(100% - 24px));border:0;border-radius:24px;padding:0;background:#121716;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.35)}.dialog::backdrop{background:rgba(20,25,23,.76);backdrop-filter:blur(5px)}.lb-stage{position:relative;display:grid;place-items:center;background:#0f1211;min-height:min(72vh,720px)}.lb-stage img,.lb-stage iframe,.lb-stage video{display:block;max-width:100%;max-height:72vh;object-fit:contain}.lb-stage iframe{width:100%;height:min(72vh,720px);border:0;background:#000}.lb-stage video{width:100%;background:#000}.lb-close,.lb-nav{position:absolute;z-index:2;border:0;background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(10px);cursor:pointer;display:grid;place-items:center}.lb-close{right:14px;top:14px;width:42px;height:42px;border-radius:50%;font-size:22px}.lb-nav{top:50%;translate:0 -50%;width:44px;height:56px;border-radius:15px;font-size:26px}.lb-prev{left:12px}.lb-next{right:12px}.lb-info{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 18px;background:#1c211f}.lb-text{min-width:0;flex:1}.lb-text strong{display:block;font-size:16px}.lb-text>span{display:block;color:#b8c0bc;font-size:12px;margin-top:4px}.download{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#edf2ee;color:#263b31;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:850;white-space:nowrap}.lb-prompt{margin:11px 0 0;padding:11px 12px;border-radius:12px;background:#252c29;color:#c8d0cc;font-size:12px;line-height:1.6}.lb-prompt-actions{margin-top:8px;display:flex;justify-content:flex-start}.lb-copy{border:1px solid #4b5752;background:#303a36;color:#eef3ef;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:28px}.hero-card{padding:27px}}
@media (max-width:620px){.wrap{width:min(100% - 20px,1180px)}.hero{padding:18px 0 10px}.hero-card{border-radius:22px;padding:21px 18px}.hero-top{align-items:flex-start}.theme-btn{font-size:11px;padding:8px 9px}.hero h1{font-size:34px}.subtitle{font-size:15px}.demo-note{font-size:12px}.toolbar{align-items:flex-start;flex-direction:column;gap:5px;padding-top:14px}.tabs{width:100%}.tab{padding:9px 14px}.sort-wrap{width:100%;justify-content:flex-end}.sort{padding-top:8px;padding-bottom:8px}.section-head{align-items:center}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{border-radius:15px}.meta{padding:10px 10px 12px;align-items:flex-start;flex-direction:column;gap:7px}.title{font-size:14px}.cat{font-size:10px;padding:5px 7px}.prompt-zone{padding:9px}.prompt-preview{font-size:10px}.copy-prompt{font-size:11px;padding:8px}.lb-stage{min-height:58vh}.lb-stage img,.lb-stage iframe,.lb-stage video{max-height:65vh}.lb-stage iframe{height:58vh}.lb-info{align-items:stretch;flex-direction:column}.download{width:100%}.lb-prompt-actions{display:block}.lb-copy{width:100%}}
@media (max-width:380px){.grid{grid-template-columns:1fr}.photo-wrap{aspect-ratio:16/10}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body class="locked">
<section class="auth" id="auth" aria-labelledby="authTitle">
  <div class="auth-card">
    <div class="auth-mark">4×10</div>
    <h1 id="authTitle">台灣日常相簿 DEMO</h1>
    <p>目前展示 4 個分類；模板已預留 8 個分類槽位。請先輸入 DEMO 密碼。</p>
    <form class="auth-form" id="authForm">
      <input type="text" name="username" autocomplete="username" value="demo" hidden aria-hidden="true" tabindex="-1">
      <input class="auth-input" id="password" type="password" autocomplete="current-password" placeholder="輸入密碼" aria-label="DEMO 密碼" required>
      <button class="auth-submit" type="submit">進入相簿</button>
      <p class="auth-error" id="authError" role="alert"></p>
    </form>
  </div>
</section>
<div class="site-shell">
<header class="hero">
  <div class="wrap">
    <section class="hero-card" aria-labelledby="siteTitle">
      <div class="hero-top"><div class="badge" id="badge">4 × 10 DEMO</div><button class="theme-btn" id="themeBtn" type="button">變換配色</button></div>
      <h1 id="siteTitle">你我身邊・台灣日常相簿</h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="demo-note" id="note"></div>
    </section>
  </div>
</header>
<main class="wrap">
  <div class="toolbar">
    <nav class="tabs" id="tabs" aria-label="相簿種類"></nav>
    <label class="sort-wrap">排序
      <select class="sort" id="sort" aria-label="媒體排序"><option value="desc">最新優先</option><option value="asc">最舊優先</option></select>
    </label>
  </div>
  <div class="section-head"><p class="count" id="count" aria-live="polite"></p><a class="category-link" id="categoryDrive" href="#" target="_blank" rel="noopener">開啟此類 Drive</a></div>
  <div class="ai-help" id="aiHelp" hidden><strong>AI 後製怎麼用？</strong> 喜歡這張照片的風格嗎？點照片下方的「複製提示詞」，再到繪圖 AI 貼上提示詞並附上自己的照片，就能試試相同風格。</div>
  <section class="grid" id="grid" aria-label="媒體列表"></section>
</main>
<footer class="wrap">目前啟用 4 類、每類 10 個去敏 DEMO；模板預留 8 個分類槽位。公開 DEMO 使用內建素材，客製時可改接自己的 Google Drive。</footer>
</div>
<dialog class="dialog" id="lightbox" aria-label="媒體檢視">
  <div class="lb-stage">
    <img id="lbImage" alt="">
    <video id="lbVideo" controls playsinline hidden></video>
    <iframe id="lbVideoFrame" title="Google Drive 影片播放器" allow="autoplay; fullscreen" hidden></iframe>
    <button class="lb-close" id="lbClose" type="button" aria-label="關閉">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="上一個">‹</button>
    <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="下一個">›</button>
  </div>
  <div class="lb-info">
    <div class="lb-text">
      <strong id="lbTitle"></strong><span id="lbDate"></span>
      <div id="lbPromptWrap" hidden><p class="lb-prompt" id="lbPrompt"></p><div class="lb-prompt-actions"><button class="lb-copy" id="lbCopyPrompt" type="button">複製提示詞</button></div></div>
    </div>
    <a class="download" id="lbDownload" target="_blank" rel="noopener">下載</a>
  </div>
</dialog>
<script src="site-config.js"></script>
<script>
(()=>{
  const cfg=window.DEMO_CONFIG;
  const $=s=>document.querySelector(s);
  const state={category:cfg.categories[0].id,order:'desc',visible:[],activeIndex:0,theme:0};
  const catById=Object.fromEntries(cfg.categories.map(c=>[c.id,c]));
  const themeKey='album-demo-theme-index';
  const authKey='album-demo-authenticated';

  function unlock(){document.body.classList.remove('locked');$('#auth').hidden=true;sessionStorage.setItem(authKey,'1')}
  if(sessionStorage.getItem(authKey)==='1') unlock();
  $('#authForm').addEventListener('submit',e=>{e.preventDefault();if($('#password').value===cfg.password){$('#authError').textContent='';unlock()}else{$('#authError').textContent='密碼不正確，請再試一次。';$('#password').select()}});

  $('#siteTitle').textContent=cfg.siteName;$('#subtitle').textContent=cfg.subtitle;$('#badge').textContent=cfg.badge;$('#note').textContent=cfg.note;

  function applyTheme(index){
    state.theme=((index%cfg.themes.length)+cfg.themes.length)%cfg.themes.length;
    const t=cfg.themes[state.theme],root=document.documentElement;
    Object.entries({bg:t.bg,panel:t.panel,ink:t.ink,muted:t.muted,line:t.line,accent:t.accent,accent2:t.accent2,soft:t.soft,hero1:t.hero1,hero2:t.hero2}).forEach(([k,v])=>root.style.setProperty(`--${k}`,v));
    $('#themeBtn').textContent=`變換配色 · ${t.name} ${state.theme+1}/${cfg.themes.length}`;
    localStorage.setItem(themeKey,String(state.theme));document.querySelector('meta[name="theme-color"]').setAttribute('content',t.bg)
  }
  const savedTheme=Number.parseInt(localStorage.getItem(themeKey)??'0',10);applyTheme(Number.isFinite(savedTheme)?savedTheme:0);$('#themeBtn').addEventListener('click',()=>applyTheme(state.theme+1));

  cfg.categories.forEach((cat,i)=>{
    const b=document.createElement('button');b.type='button';b.className='tab'+(i===0?' active':'');b.dataset.category=cat.id;b.setAttribute('aria-pressed',i===0?'true':'false');
    b.append(document.createTextNode(cat.label));const n=document.createElement('span');n.className='tab-count';n.textContent=String(cfg.items.filter(item=>item.category===cat.id).length);b.append(n);
    b.addEventListener('click',()=>{state.category=cat.id;document.querySelectorAll('.tab').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});render()});$('#tabs').appendChild(b)
  });
  $('#sort').addEventListener('change',e=>{state.order=e.target.value;render()});

  async function copyText(text,button){
    let ok=false;
    try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(_){ok=false}
    if(!ok){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{ok=document.execCommand('copy')}catch(_){ok=false}t.remove()}
    if(button){const original=button.dataset.original||button.textContent;button.dataset.original=original;button.textContent=ok?'已複製提示詞':'複製失敗，請重試';clearTimeout(button._timer);button._timer=setTimeout(()=>button.textContent=original,1600)}
    return ok
  }

  function currentItems(){return cfg.items.filter(x=>x.category===state.category).slice().sort((a,b)=>{const av=new Date(a.date).getTime(),bv=new Date(b.date).getTime();return state.order==='desc'?bv-av:av-bv})}
  function render(){
    const items=currentItems();state.visible=items;const cat=catById[state.category];
    $('#count').textContent=`${cat.label} · ${items.length} ${cat.unit}`;$('#aiHelp').hidden=!cat.aiPrompt;
    const driveId=cfg.driveFolders[state.category],driveLink=$('#categoryDrive');
    if(driveId){driveLink.hidden=false;driveLink.href=`https://drive.google.com/drive/folders/${driveId}`}else{driveLink.hidden=true;driveLink.removeAttribute('href')}
    const grid=$('#grid');grid.replaceChildren();
    items.forEach((item,index)=>{
      const card=document.createElement('article');card.className='card';card.dataset.itemId=item.id;
      const open=document.createElement('button');open.type='button';open.className='card-open';open.setAttribute('aria-label',`開啟 ${item.title}`);
      const media=document.createElement('div');media.className='photo-wrap';
      const img=document.createElement('img');img.className='photo';img.src=item.kind==='video'?item.poster:item.src;img.alt=item.title;img.loading='lazy';img.referrerPolicy='no-referrer';if(item.fileId||item.posterFileId)img.dataset.fileId=item.kind==='video'?item.posterFileId:item.fileId;media.appendChild(img);
      if(item.kind==='video'){const play=document.createElement('span');play.className='play-pill';play.textContent='影片';const icon=document.createElement('span');icon.className='play-icon';icon.textContent='▶';media.append(play,icon)}
      const pill=document.createElement('span');pill.className='drive-pill';pill.textContent=item.sourceLabel||(item.fileId||item.posterFileId?'Google Drive':'DEMO');media.appendChild(pill);
      const meta=document.createElement('div');meta.className='meta';const left=document.createElement('div');const title=document.createElement('div');title.className='title';title.textContent=item.title;const date=document.createElement('div');date.className='date';date.textContent=item.date.replaceAll('-',' / ');left.append(title,date);const badge=document.createElement('span');badge.className='cat';badge.textContent=cat.label;meta.append(left,badge);open.append(media,meta);open.addEventListener('click',()=>openLightbox(index));card.appendChild(open);
      if(item.prompt){const zone=document.createElement('div');zone.className='prompt-zone';const prev=document.createElement('p');prev.className='prompt-preview';prev.textContent=item.prompt;const copy=document.createElement('button');copy.type='button';copy.className='copy-prompt';copy.textContent='複製提示詞';copy.setAttribute('aria-label',`複製 ${item.title} 提示詞`);copy.addEventListener('click',()=>copyText(item.prompt,copy));zone.append(prev,copy);card.appendChild(zone)}
      grid.appendChild(card)
    })
  }

  function openLightbox(index){state.activeIndex=index;syncLightbox();$('#lightbox').showModal()}
  function syncLightbox(){
    const item=state.visible[state.activeIndex];if(!item)return;const img=$('#lbImage'),video=$('#lbVideo'),frame=$('#lbVideoFrame');
    video.pause();video.removeAttribute('src');frame.removeAttribute('src');
    if(item.kind==='video'){
      img.hidden=true;
      if(item.videoSrc){frame.hidden=true;video.hidden=false;video.src=item.videoSrc;video.load()}else{video.hidden=true;frame.hidden=false;frame.src=item.preview}
    }else{video.hidden=true;frame.hidden=true;img.hidden=false;img.src=item.src;img.alt=item.title}
    $('#lbTitle').textContent=item.title;$('#lbDate').textContent=`${catById[item.category].label} · ${item.date.replaceAll('-',' / ')}`;$('#lbDownload').href=item.download;$('#lbDownload').setAttribute('download',item.fileName);$('#lbDownload').textContent=item.kind==='video'?'下載影片':'下載圖片';
    const wrap=$('#lbPromptWrap');wrap.hidden=!item.prompt;if(item.prompt){$('#lbPrompt').textContent=item.prompt;$('#lbCopyPrompt').textContent='複製提示詞';$('#lbCopyPrompt').onclick=()=>copyText(item.prompt,$('#lbCopyPrompt'))}
  }
  function move(delta){if(!state.visible.length)return;state.activeIndex=(state.activeIndex+delta+state.visible.length)%state.visible.length;syncLightbox()}
  function closeLightbox(){const video=$('#lbVideo'),frame=$('#lbVideoFrame');video.pause();video.removeAttribute('src');frame.removeAttribute('src');$('#lightbox').close()}
  $('#lbPrev').addEventListener('click',()=>move(-1));$('#lbNext').addEventListener('click',()=>move(1));$('#lbClose').addEventListener('click',closeLightbox);$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))closeLightbox()});document.addEventListener('keydown',e=>{if(!$('#lightbox').open)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
  render();
})();
</script>
</body>
</html>
